# The Recusal adapter for MCP tools on the OpenAI Agents SDK, a separate distribution from `recusal`.
#
# Why separate: `recusal` has zero runtime dependencies and a frozen compatibility
# perimeter (STABILITY.md). An adapter follows a framework that releases on its own
# schedule, so it carries that dependency and its own version here, and a framework's
# breaking change never forces a release of the kernel.
#
# Build backend pinned exactly, the same pin as the kernel's pyproject.toml: a floating
# backend is unreviewed code in the release path.
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "recusal-openai-agents-mcp"
dynamic = ["version"]
description = "Recusal gate for MCP tools on an OpenAI Agents SDK agent: judge each local MCP server call and each hosted MCP approval, refuse before it runs, and optionally put each decision on a hash-chained audit log."
readme = "README.md"
# The SDK's own minimum.
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Philip Paz", email = "philip.paz@gmail.com" }]
keywords = ["recusal", "mcp", "ai-agents", "agent-governance", "guardrails", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    # 0.16.0 is the first release whose `recusal.invocation.detached` does not call
    # itself. The gate copies a call's arguments with it, and what a copy that calls
    # itself costs moves with the depth the sender nests the arguments at.
    "recusal>=0.16.0,<1",
    # 0.2.0 is the first release with `shared_name_reason`, `tools_gated` and the
    # `agent_gated` argument of `gate_tools`, which this package uses.
    "recusal-openai-agents>=0.2.0,<1",
    # The lower bound is the version the pinned CI lane tests; the weekly latest lane
    # (.github/workflows/compat.yml) tests the newest release.
    "openai-agents>=0.24.0,<1",
    "mcp>=2.3.0,<3",
    # The gate validates a call's arguments against the tool's listed input schema with
    # these two. The MCP SDK depends on both; the lower bounds are the versions the pinned
    # CI lane tests (requirements/adapter-openai-agents-mcp.txt).
    "jsonschema>=4.26.0,<5",
    "referencing>=0.37.0,<1",
]

[project.urls]
Homepage = "https://recusal.io"
Documentation = "https://github.com/philpaz/recusal/tree/main/adapters/openai-agents-mcp"
Repository = "https://github.com/philpaz/recusal"
Issues = "https://github.com/philpaz/recusal/issues"
Changelog = "https://github.com/philpaz/recusal/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/recusal_openai_agents_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/recusal_openai_agents_mcp"]
