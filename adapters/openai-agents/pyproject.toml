# The Recusal adapter for the OpenAI Agents SDK, a separate distribution from `recusal`.
#
# Why separate: `recusal` has zero runtime dependencies and a frozen compatibility
# perimeter (STABILITY.md). An adapter follows a framework that releases on its own
# schedule, so it carries that dependency and its own version here, and a framework's
# breaking change never forces a release of the kernel.
#
# Build backend pinned exactly, the same pin as the kernel's pyproject.toml: a floating
# backend is unreviewed code in the release path.
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "recusal-openai-agents"
dynamic = ["version"]
description = "Recusal gate for the OpenAI Agents SDK: judge every function tool call in a tool input guardrail, refuse before it runs, and optionally put each decision on a hash-chained audit log."
readme = "README.md"
# The SDK's own minimum.
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Philip Paz", email = "philip.paz@gmail.com" }]
keywords = ["recusal", "openai-agents", "ai-agents", "agent-governance", "guardrails", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    # 0.17.0 is the first release whose `recusal.invocation` has `cache_target`, which this
    # gate's own walk takes the step from a cache to what it calls with, and the refusal
    # classes it imports and gives a reason for beside those of 0.16.0 (`OpenDispatch`,
    # `ProxiedCallable`, `WeakProxy`); its walk refuses a weak proxy, a single-dispatch
    # function with nothing registered and the held wrappers 0.16.0 did not find.
    "recusal>=0.17.0,<1",
    # The lower bound is the version the pinned CI lane tests; the weekly latest lane
    # (.github/workflows/compat.yml) tests the newest release.
    "openai-agents>=0.24.0,<1",
]

[project.urls]
Homepage = "https://recusal.io"
Documentation = "https://github.com/philpaz/recusal/tree/main/adapters/openai-agents"
Repository = "https://github.com/philpaz/recusal"
Issues = "https://github.com/philpaz/recusal/issues"
Changelog = "https://github.com/philpaz/recusal/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/recusal_openai_agents/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/recusal_openai_agents"]
