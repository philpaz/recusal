<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="title desc">
<title id="title">recusal: one kernel, eight adapter packages</title>
<desc id="desc">Each adapter package depends on the recusal kernel. recusal-langchain also depends on recusal-langgraph. recusal-openai-agents-mcp also depends on recusal-openai-agents. The kernel depends on nothing.</desc>
