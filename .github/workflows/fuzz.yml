name: Fuzz

# Coverage-guided fuzzing of the kernel's untrusted-input seams, with ClusterFuzzLite
# (libFuzzer through atheris). The harnesses are fuzz/fuzz_*.py; each states the contract
# it holds its target to. tests/test_fuzz_harnesses.py runs the same harnesses on their
# seeds in the ordinary suite, so a harness cannot rot between fuzzing runs.
#
# On a pull request the fuzzers run briefly against the change. On a schedule they run
# longer against main. A crash fails the job and uploads the input that caused it.

on:
  pull_request:
    paths:
      - "recusal/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 5 * * 3" # weekly, a longer run against main
  workflow_dispatch:

permissions: read-all

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz the kernel's untrusted-input seams
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Build the fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
      - name: Run the fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: python
          sanitizer: address
          # a pull request fuzzes for two minutes in total; the scheduled run for ten
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 120 || 600 }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          output-sarif: false
