name: Release an adapter

# Publish ONE adapter package under adapters/ to PyPI via Trusted Publishing (OIDC), no
# API token stored in the repo. The same path as release.yml, for a different package:
# the full gate at the release commit, a delegated hash-locked build with provenance,
# Sigstore signing at the release boundary, then publish, failing closed at each step.
#
# A release is a GitHub Release whose tag is <distribution>-v<version>, for example
# recusal-langgraph-v0.1.0. One-time setup on PyPI, per adapter: a trusted publisher for
# that project (a pending one before its first release) pointing at
#   owner: philpaz · repo: recusal · workflow: release-adapter.yml · environment: pypi
#
# An adapter that requires another adapter (recusal-langchain requires
# recusal-langgraph) can only be installed from PyPI once the one it requires is there:
# release the required one first.

on:
  release:
    types: [published]
  # A manual run rehearses the test + build + provenance path for the chosen adapter
  # without signing or publishing.
  workflow_dispatch:
    inputs:
      adapter:
        description: "The adapter to rehearse (its directory under adapters/)"
        required: true
        type: choice
        options:
          - crewai
          - google-adk
          - langchain
          - langgraph
          - openai
          - openai-agents
          - openai-agents-mcp
          - pydantic-ai

permissions:
  contents: read

jobs:
  # Which adapter this run is for. Every published release reaches this workflow, the
  # kernel's vX.Y.Z releases included; those are not adapter releases, so this job, and
  # with it every job below, is skipped for any tag that does not start with `recusal-`.
  # release.yml skips the other way round.
  resolve:
    name: Resolve the adapter
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'recusal-')
    runs-on: ubuntu-latest
    outputs:
      directory: ${{ steps.adapter.outputs.directory }}
      distribution: ${{ steps.adapter.outputs.distribution }}
      tests: ${{ steps.adapter.outputs.tests }}
      own_tests: ${{ steps.adapter.outputs.own_tests }}
    env:
      # Never interpolated into a script: the tag and the input reach the shell as data.
      EVENT: ${{ github.event_name }}
      CHOSEN: ${{ inputs.adapter }}
    steps:
      # Actions are pinned to immutable commit SHAs (a moving tag is a rug-pull surface;
      # the trailing comment names the tag each SHA was resolved from).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; the default keeps a live token in .git
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # On a release the tag names the adapter and must match its version in the tree; a
      # tag that names no adapter, or the wrong version, fails here before any test runs.
      - name: Resolve from the release tag, or from the rehearsal input
        id: adapter
        # No pipe: a pipe would report the last command's status and hide a refusal.
        run: |
          if [ "$EVENT" = "release" ]; then
            python tools/adapter_meta.py --from-tag "$GITHUB_REF_NAME" > /tmp/adapter.txt
          else
            python tools/adapter_meta.py "$CHOSEN" > /tmp/adapter.txt
          fi
          cat /tmp/adapter.txt
          cat /tmp/adapter.txt >> "$GITHUB_OUTPUT"

  # A release must prove the exact release commit passes the full gate before anything
  # is built or published, and an adapter's gate includes its framework: the whole suite
  # first, as the kernel's release runs it, then the adapter's own tests with the pinned
  # framework installed, where they run instead of skipping.
  test:
    name: Full suite, then the adapter's tests with its framework
    needs: resolve
    runs-on: ubuntu-latest
    env:
      DIRECTORY: ${{ needs.resolve.outputs.directory }}
      TESTS: ${{ needs.resolve.outputs.tests }}
      OWN_TESTS: ${{ needs.resolve.outputs.own_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; the default keeps a live token in .git
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q
      - name: Install the adapter's pinned framework
        run: pip install -r "adapters/$DIRECTORY/tested-with.txt"
      # Word splitting is intended: both are space-separated lists of test files from
      # tools/adapter_meta.py. No pipe, so a failing run fails the step.
      - name: Test the adapter with its framework
        run: |
          # shellcheck disable=SC2086
          pytest -q $TESTS
      # A skip among the adapter's own tests would mean its framework did not install,
      # and the run above would have passed while proving nothing about the gate.
      - name: The adapter's own tests ran; none skipped
        run: |
          # shellcheck disable=SC2086
          pytest -q -rs $OWN_TESTS > /tmp/own-tests.txt
          cat /tmp/own-tests.txt
          if grep -q "^SKIPPED" /tmp/own-tests.txt; then
            echo "::error::an adapter test was skipped with the framework installed"
            exit 1
          fi

  # The build and its provenance generation are DELEGATED to the reusable
  # build-adapter-dist.yml workflow (the pattern GitHub documents for SLSA v1 Build
  # Level 3): the provenance records that workflow's identity as the signer
  # (job_workflow_ref), so a verifier can require it:
  #   gh attestation verify dist/<file> --repo philpaz/recusal \
  #     --signer-workflow philpaz/recusal/.github/workflows/build-adapter-dist.yml
  build:
    name: Build distributions
    needs: [resolve, test]
    permissions:
      contents: read
      # granted THROUGH to build-adapter-dist.yml's job, which uses both only for
      # actions/attest-build-provenance
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-adapter-dist.yml # zizmor: ignore[self-repository]
    with:
      directory: ${{ needs.resolve.outputs.directory }}

  # Signatures live at the release boundary, in CI, as for the kernel: the built
  # distributions are signed keylessly and the bundles attached to the GitHub Release.
  sign:
    name: Sign the distributions (Sigstore)
    needs: build
    runs-on: ubuntu-latest
    # Only a published release has an asset list to attach bundles to.
    if: github.event_name == 'release'
    permissions:
      id-token: write # Sigstore keyless signing identity (OIDC)
      # ONLY to attach the .sigstore.json bundles to the triggering Release; this is
      # the one job that may write release assets, and it writes nothing else.
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Sign distributions and generated source archives, attach bundles
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*
          release-signing-artifacts: true

  publish:
    name: Publish to PyPI
    # a distribution that could not be signed must not publish: fail closed, a
    # human looks (manual dispatch still rehearses test + build without publishing)
    needs: [resolve, build, sign]
    runs-on: ubuntu-latest
    # Only publish on an actual release event, not on a manual rehearsal.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.resolve.outputs.distribution }}/
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Deliberately no skip-existing, as in release.yml: re-running a release whose
        # version is already on PyPI must hard-fail, so a divergent rebuild can never
        # silently no-op over the published artifacts.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
