name: Build an adapter's distributions

# The adapter counterpart of build-dist.yml: the release build of ONE adapter package
# under adapters/ and its provenance generation, in a reusable workflow, the pattern
# GitHub documents for SLSA v1 Build Level 3. The caller delegates the whole build job,
# the signing identity recorded in the provenance is THIS workflow's ref
# (job_workflow_ref), and a verifier can require it:
#   gh attestation verify dist/<file> --repo philpaz/recusal \
#     --signer-workflow philpaz/recusal/.github/workflows/build-adapter-dist.yml
# It is a separate file from build-dist.yml on purpose: the kernel's builder, and the
# identity every published kernel verification command names, do not change for an
# adapter. Stated narrowly, as there: this pins WHICH workflow built and attested the
# artifacts; it does not make the build byte-reproducible.

on:
  workflow_call:
    inputs:
      directory:
        description: "The adapter's directory under adapters/ (for example langgraph)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.directory }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance attestations are written to the repo's attestation store; both
      # grants exist only for actions/attest-build-provenance below.
      id-token: write
      attestations: write
    env:
      # Never interpolated into a script: a workflow input reaches the shell as data.
      DIRECTORY: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job here pushes; the default keeps a live token in .git
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The same hash-locked toolchain the kernel is built with, and for the same
      # reason: no unpinned PEP 517 resolution happens in a release build.
      - name: Install build tooling (hash-locked)
        run: python -m pip install --require-hashes -r release-requirements.txt

      # The adapter's names, version and the adapters it requires, read from its own
      # pyproject.toml. On a tag the tag must be <distribution>-v<version> for the
      # version in the tree, or this step fails and nothing is built.
      - name: Resolve the adapter, and hold the tag to the package version
        id: adapter
        # No pipe: a pipe would report the last command's status and hide a refusal.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python tools/adapter_meta.py "$DIRECTORY" --tag "$GITHUB_REF_NAME" > /tmp/adapter.txt
          else
            python tools/adapter_meta.py "$DIRECTORY" > /tmp/adapter.txt
          fi
          cat /tmp/adapter.txt
          cat /tmp/adapter.txt >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel (no uncontrolled isolation env)
        run: python -m build --no-isolation --outdir dist "adapters/$DIRECTORY"

      - name: Check metadata
        run: python -m twine check dist/*

      - name: The build produced exactly the two named files
        env:
          WHEEL: ${{ steps.adapter.outputs.wheel }}
          SDIST: ${{ steps.adapter.outputs.sdist }}
        run: |
          GOT="$(ls dist | sort | tr '\n' ' ')"
          WANT="$(printf '%s\n%s\n' "$WHEEL" "$SDIST" | sort | tr '\n' ' ')"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::dist/ holds [$GOT], expected [$WANT]"
            exit 1
          fi

      # What the adapter needs beside it to run, built from this same commit and kept
      # OUT of dist/: the kernel, and any adapter this one requires. They are installed
      # for the smoke test below and are not attested, signed or published here; each
      # has its own release.
      - name: Build the kernel and required adapters for the smoke test only
        env:
          SIBLINGS: ${{ steps.adapter.outputs.siblings }}
        run: |
          python -m build --no-isolation --wheel --outdir support .
          for sibling in $SIBLINGS; do
            python -m build --no-isolation --wheel --outdir support "adapters/$sibling"
          done

      # The artifact that ships must gate a real agent OUTSIDE the source tree. The
      # smoke test refuses to pass if what it imported is the checkout.
      - name: Smoke test the built wheel from a neutral directory
        env:
          WHEEL: ${{ steps.adapter.outputs.wheel }}
          DISTRIBUTION: ${{ steps.adapter.outputs.distribution }}
          VERSION: ${{ steps.adapter.outputs.version }}
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet support/*.whl "dist/$WHEEL" \
            -r "adapters/$DIRECTORY/tested-with.txt"
          GOT="$(cd /tmp && /tmp/wheelcheck/bin/python -c 'import sys; from importlib.metadata import version; print(version(sys.argv[1]))' "$DISTRIBUTION")"
          if [ "$GOT" != "$VERSION" ]; then
            echo "::error::built wheel reports $GOT but the version source says $VERSION"
            exit 1
          fi
          (cd /tmp && /tmp/wheelcheck/bin/python "$GITHUB_WORKSPACE/adapters/$DIRECTORY/smoke_test.py")

      # The wheel ships py.typed: check the installed package against the
      # framework's own types, the same check the pull request lane runs.
      - name: Type-check the built wheel as installed
        env:
          MODULE: ${{ steps.adapter.outputs.module }}
        run: |
          /tmp/wheelcheck/bin/pip install --quiet "mypy>=1.8,<2"
          (cd /tmp && /tmp/wheelcheck/bin/python -m mypy --check-untyped-defs --warn-unused-ignores --warn-redundant-casts -p "$MODULE")

      # Supply-chain records for the exact bytes that ship (stated narrowly: the SBOM
      # catalogs the built distributions, and the attestation binds them to this
      # workflow run's provenance; neither makes the build byte-reproducible).
      - name: Generate SBOM for the built distributions
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist-sbom.spdx.json
          artifact-name: dist-sbom.spdx.json
          # This job stays contents: read, so the SBOM ships as a workflow artifact and
          # is not attached to the GitHub Release (see build-dist.yml).
          upload-release-assets: false

      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
