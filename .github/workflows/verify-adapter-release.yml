name: Verify a published adapter release

# verify-release.yml, for an adapter package: the same three questions asked of the
# published artifacts alone, with the same negative controls. Was it built by the
# reusable builder in this repository, was it signed at the release boundary by the
# release workflow at the release tag, and does PyPI serve those exact bytes with
# PEP 740 provenance. Manual by design: a release has already verified itself at build
# time, and this is the independent second look an adopter can copy.
#
# It deliberately does NOT check out the repository: verification must work from the
# published artifacts alone, exactly as it does for someone who has never cloned it.

on:
  workflow_dispatch:
    inputs:
      adapter:
        description: "The adapter (its directory under adapters/)"
        required: true
        type: choice
        options:
          - crewai
          - google-adk
          - langchain
          - langgraph
          - openai
          - openai-agents
          - openai-agents-mcp
          - pydantic-ai
      version:
        description: "Published version to verify, without a leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions: read-all

jobs:
  verify:
    name: Verify recusal-${{ inputs.adapter }} ${{ inputs.version }} from the published artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read # download the release assets
      attestations: read # read the build-provenance attestations
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ADAPTER: ${{ inputs.adapter }}
      VERSION: ${{ inputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Pinned exactly, for the reason ruff is: an unpinned verifier defines what
      # "verified" means by whatever released last.
      - name: Install the Sigstore client
        run: pip install "sigstore==4.4.0"

      # The names follow from the adapter: the distribution is recusal-<adapter>, its
      # files use the normalized name (underscores), and its tag is
      # <distribution>-v<version>. A version that is not three plain numbers is refused.
      - name: Name the distribution, its files and its tag
        run: |
          case "$VERSION" in
            *[!0-9.]*|"") echo "::error::version must look like 0.1.0"; exit 1 ;;
          esac
          DISTRIBUTION="recusal-${ADAPTER}"
          MODULE="$(printf '%s' "$DISTRIBUTION" | tr '-' '_')"
          {
            echo "DISTRIBUTION=${DISTRIBUTION}"
            echo "TAG=${DISTRIBUTION}-v${VERSION}"
            echo "WHEEL=dist/${MODULE}-${VERSION}-py3-none-any.whl"
            echo "SDIST=dist/${MODULE}-${VERSION}.tar.gz"
          } >> "$GITHUB_ENV"

      - name: Download the release artifacts
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$REPO" --dir dist
          ls -l dist
          test -f "$WHEEL" && test -f "$SDIST"

      # 1. Build provenance. The signer identity is the REUSABLE adapter builder, which
      # is the whole point of the SLSA L3 pattern: not "some workflow in this repo".
      - name: Build provenance names the reusable adapter builder
        run: |
          for f in "$WHEEL" "$SDIST"; do
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "${REPO}/.github/workflows/build-adapter-dist.yml"
          done

      # The kernel's builder is a real workflow in this repository that did NOT build
      # this artifact: the sharpest wrong answer available.
      - name: NEGATIVE CONTROL, the kernel's builder must not be accepted as the signer
        run: |
          if gh attestation verify "$WHEEL" --repo "$REPO" \
               --signer-workflow "${REPO}/.github/workflows/build-dist.yml"; then
            echo "::error::provenance verification accepted a signer workflow that never built this"
            exit 1
          fi
          echo "refused, as it must"

      # 2. Sigstore bundles. Offline against the bundle attached to the release; the
      # certificate identity is the workflow that SIGNED, which is release-adapter.yml
      # at the release tag (signing happens at the release boundary, building does not).
      - name: Sigstore bundles verify offline
        run: |
          IDENTITY="https://github.com/${REPO}/.github/workflows/release-adapter.yml@refs/tags/${TAG}"
          for f in "$WHEEL" "$SDIST"; do
            python -m sigstore verify github --offline --bundle "${f}.sigstore.json" \
              --cert-identity "$IDENTITY" --repository "$REPO" "$f"
          done

      - name: NEGATIVE CONTROL, the kernel's release workflow must not be accepted as the signer
        run: |
          WRONG="https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${TAG}"
          if python -m sigstore verify github --offline --bundle "${WHEEL}.sigstore.json" \
               --cert-identity "$WRONG" --repository "$REPO" "$WHEEL"; then
            echo "::error::signature verification accepted an identity that did not sign this"
            exit 1
          fi
          echo "refused, as it must"

      # 3. PyPI. Two questions: are the published bytes the same bytes, and does PyPI
      # hold a PEP 740 attestation for them naming this repository and the release
      # workflow as the publisher.
      - name: PyPI serves the same bytes, with PEP 740 provenance
        run: |
          python - <<'PY'
          import hashlib, json, os, sys, urllib.request

          version, repo = os.environ["VERSION"], os.environ["REPO"]
          project = os.environ["DISTRIBUTION"]
          meta = json.load(
              urllib.request.urlopen(f"https://pypi.org/pypi/{project}/{version}/json")
          )
          failures = []
          if len(meta["urls"]) != 2:
              failures.append(f"PyPI serves {len(meta['urls'])} files, expected a wheel and an sdist")
          for entry in meta["urls"]:
              name = entry["filename"]
              local = os.path.join("dist", name)
              digest = hashlib.sha256(open(local, "rb").read()).hexdigest()
              if digest != entry["digests"]["sha256"]:
                  failures.append(f"{name}: PyPI bytes differ from the release asset")
              url = f"https://pypi.org/integrity/{project}/{version}/{name}/provenance"
              bundles = json.load(urllib.request.urlopen(url))["attestation_bundles"]
              publisher = bundles[0]["publisher"]
              if publisher.get("repository") != repo:
                  failures.append(f"{name}: provenance names {publisher.get('repository')}")
              if publisher.get("workflow") != "release-adapter.yml":
                  failures.append(f"{name}: provenance names workflow {publisher.get('workflow')}")
              print(f"{name}: bytes match, provenance publisher {publisher.get('repository')} "
                    f"via {publisher.get('workflow')}")
          if failures:
              sys.exit("\n".join(failures))
          PY

      - name: What this run did and did not establish
        run: |
          echo "Established: the published artifacts were built by the reusable adapter"
          echo "builder in this repository, signed at the release boundary by"
          echo "release-adapter.yml at the release tag, and PyPI serves those exact bytes"
          echo "with PEP 740 provenance. Both negative controls refused."
          echo "NOT established: byte-reproducibility, and any claim about what the source"
          echo "does. Provenance binds an artifact to a build; it does not read the code."
